name: check

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - name: Resolve dependencies
        run: moon update
      - name: Check every target
        run: moon check --target all --deny-warn
      - name: Test every target
        run: moon test --target all --deny-warn
      - name: Check formatting
        run: moon fmt --check
      - name: Check generated interfaces
        shell: bash
        run: moon info && git diff --exit-code
      - name: Test Native CLI
        run: python tools/test_cli.py
      - name: Verify performance and effective source scale
        run: |
          python tools/benchmark.py
          python tools/count_moonbit_loc.py
